<!doctype html>
<html lang="en" data-starting>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060a" />
    <title>Sport Cafe Afrika</title>
    <meta name="description" content="Sport Cafe Afrika: 4 pool tables, 3 table tennis tables and 2 dart machines." />
    <style>
      html { background: #07060a; color-scheme: dark; }
      body { margin: 0; }
      [data-starting] body > :is(header, main) { visibility: hidden; }
      #loading { display: none; }
      [data-starting] #loading {
        position: fixed; inset: 0; z-index: 30; display: grid; place-content: center;
        padding: 24px; text-align: center; background: #07060a; color: #f4efe6;
        font: 600 1rem/1.5 system-ui, sans-serif;
      }
      #loading strong { font-size: clamp(1.6rem, 5vw, 3rem); }
      #loading p { margin: 0.6rem 0 0; color: #f2b441; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <div id="loading">
      <strong>Sport Cafe Afrika</strong>
      <p role="status">Preparing the tables&hellip;</p>
    </div>
    <noscript><style>
      #loading, #stage, .hint, .cta { display: none !important; }
      [data-starting] body > :is(header, main) { visibility: visible; }
      #story { padding: 2rem 1rem 0; color: #f4efe6; }
    </style></noscript>
    <header class="site-header">
      <a class="brand" href="#story">Sport Cafe Afrika</a>
    </header>

    <main>
      <section id="story" aria-label="Sport Cafe Afrika: pool, table tennis and darts">
        <canvas id="stage" aria-hidden="true"></canvas>
        <div class="veil" aria-hidden="true"></div>
        <div class="flash" aria-hidden="true"></div>

        <div class="caption caption--pool">
          <p class="num">4</p>
          <h2>Pool tables</h2>
        </div>
        <div class="caption caption--tennis">
          <p class="num">3</p>
          <h2>Table tennis tables</h2>
        </div>
        <div class="caption caption--darts">
          <p class="num">2</p>
          <h2>Dart machines</h2>
        </div>

        <p class="hint">Scroll to play</p>
        <a class="cta" href="#book">Reserve a table</a>
      </section>

      <section id="menu">
        <h2>Menu</h2>
        <p>Coming in a later step.</p>
      </section>
    </main>

    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
